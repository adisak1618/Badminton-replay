<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>Overlay proof frames</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <script type="module">
      // e2e/frames.ts opens this through the dev server: the frames are drawn by src/overlay itself.
      import { checks, frames, headerChecks } from '/src/overlay/proof-frames.ts';
      await Promise.all([500, 600, 700, 800].map((w) => document.fonts.load(`${w} 30px Kanit`, 'กขค ABC 012')));
      const crop = (s) => {
        if (!s.crop) return s.canvas;
        const c = document.createElement('canvas');
        c.width = s.crop.w;
        c.height = s.crop.h;
        c.getContext('2d').drawImage(s.canvas, s.crop.x, s.crop.y, s.crop.w, s.crop.h, 0, 0, s.crop.w, s.crop.h);
        return c;
      };
      const only = new URLSearchParams(location.search).has('checks');
      window.__frames = only ? [] : frames().map((s) => ({ name: s.name, url: crop(s).toDataURL(s.crop ? 'image/png' : 'image/jpeg', 0.9) }));
      window.__checks = checks();
      window.__header = headerChecks();
      window.__done = true;
    </script>
  </body>
</html>
